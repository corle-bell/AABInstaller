name: Android Build

# 仅手动触发，不在 push / PR 时自动运行
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build variant
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      publish_release:
        description: Publish APK to GitHub Releases
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag (e.g. v1.1.0), required when publishing
        required: false
        type: string
      release_notes:
        description: Release notes (optional)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release inputs
        if: inputs.publish_release
        run: |
          if [ -z "${{ inputs.release_tag }}" ]; then
            echo "release_tag is required when publish_release is enabled"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            ./gradlew :app:assembleDebug --stacktrace
          fi

      - name: Resolve APK path
        id: apk
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            echo "path=app/build/outputs/apk/release/app-release-unsigned.apk" >> "$GITHUB_OUTPUT"
            echo "asset_name=AABInstaller-${{ inputs.release_tag }}-unsigned.apk" >> "$GITHUB_OUTPUT"
          else
            echo "path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "asset_name=AABInstaller-${{ inputs.release_tag }}-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

      - name: Prepare release asset
        if: inputs.publish_release
        run: cp "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.asset_name }}"

      - name: Publish GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: AABInstaller ${{ inputs.release_tag }}
          body: |
            ${{ inputs.release_notes }}

            **Build type:** ${{ inputs.build_type }}
            **Asset:** ${{ steps.apk.outputs.asset_name }}
          files: ${{ steps.apk.outputs.asset_name }}
          draft: false
          prerelease: ${{ inputs.build_type == 'release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
