import org.gradle.api.attributes.java.TargetJvmEnvironment

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.corlebell.aabinstaller'
    compileSdk 34

    defaultConfig {
        applicationId "com.corlebell.aabinstaller"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        jniLibs {
            // aapt2 以 libaapt2.so 打包，必须解压到 nativeLibraryDir 才能 exec
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/INDEX.LIST',
                'META-INF/versions/**',
                // bundletool jar 内置的桌面平台 aapt2，手机上用不到
                'linux/**',
                'macos/**',
                'windows/**'
            ]
        }
    }
}

dependencies {
    implementation project(':bundletool-core')
    implementation project(':installer')

    // 与 bundletool-core 一致：强制 Guava 的 standard-jvm（含 MoreFiles）变体
    constraints {
        implementation('com.google.guava:guava') {
            attributes {
                attribute(
                        TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
                        objects.named(TargetJvmEnvironment, TargetJvmEnvironment.STANDARD_JVM)
                )
            }
        }
    }

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // 扫码填链接
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
